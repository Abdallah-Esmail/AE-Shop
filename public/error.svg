<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Chat Bubble Blue Gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>

    <!-- Chat Bubble Inner Highlight -->
    <linearGradient id="bubbleHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Clouds (Faint White/Gray) -->
  <g fill="#F1F5F9" opacity="0.75">
    <!-- Top Center Cloud -->
    <path d="M 220,85 C 220,60 250,45 275,55 C 290,35 330,35 345,55 C 365,45 395,60 390,85 C 410,95 405,125 385,130 L 215,130 C 195,125 195,95 220,85 Z" />
    <!-- Right Cloud -->
    <path d="M 400,155 C 400,135 425,125 445,135 C 455,120 485,120 495,135 C 510,125 535,135 530,155 C 545,165 540,190 525,195 L 395,195 C 380,190 380,165 400,155 Z" />
  </g>

  <!-- Background Open Box (Faint Right) -->
  <g fill="#EEF2F6" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- Box Body -->
    <rect x="365" y="270" width="125" height="110" fill="#F3F4F6"/>
    <!-- Left Flap -->
    <polygon points="365,270 320,230 365,200 410,230" fill="#E5E7EB"/>
    <!-- Right Flap -->
    <polygon points="490,270 535,230 490,200 445,230" fill="#D1D5DB"/>
    <!-- Inner Front Shadow -->
    <polygon points="365,270 490,270 490,290 365,290" fill="#E5E7EB"/>
    <!-- Box Circle Logo Placeholder -->
    <circle cx="427" cy="325" r="12" fill="none" stroke="#D1D5DB" stroke-width="3"/>
  </g>

  <!-- Bottom Baseline -->
  <g stroke="#C5CEDA" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="418" x2="540" y2="418"/>
    <!-- Left & Right Small Accent Dots -->
    <circle cx="50" cy="418" r="3" fill="#C5CEDA" stroke="none"/>
    <circle cx="550" cy="418" r="3" fill="#C5CEDA" stroke="none"/>
  </g>

  <!-- Front Shopping Bag -->
  <g transform="translate(10, 0)">
    <!-- Bag Main Body -->
    <path d="M 120,200 
             L 330,200 
             L 330,395 
             A 35,35 0 0,1 295,430 
             L 155,430 
             A 35,35 0 0,1 120,395 
             Z" 
          fill="#F8FAFC" 
          stroke="#A6B4C5" 
          stroke-width="4" 
          stroke-linejoin="round"/>
    
    <!-- Bag Fold Lines -->
    <path d="M 120,225 L 330,225" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M 120,200 L 140,225 L 310,225 L 330,200" fill="none" stroke="#A6B4C5" stroke-width="3" stroke-linejoin="round"/>

    <!-- Bag Handles -->
    <path d="M 165,200 C 165,370 285,370 285,200" 
          fill="none" 
          stroke="#A6B4C5" 
          stroke-width="4" 
          stroke-linecap="round"/>
    
    <!-- Handle Attachments (Rings) -->
    <circle cx="165" cy="235" r="7" fill="#F8FAFC" stroke="#A6B4C5" stroke-width="3"/>
    <circle cx="285" cy="235" r="7" fill="#F8FAFC" stroke="#A6B4C5" stroke-width="3"/>
  </g>

  <!-- Sad Speech Bubble (Top Left) -->
  <g transform="translate(65, 30)">
    <!-- Bubble Tail -->
    <path d="M 105,120 L 118,155 L 85,130 Z" fill="#0288D1" stroke="#0288D1" stroke-width="2" stroke-linejoin="round"/>

    <!-- Main Bubble Body -->
    <rect x="20" y="30" width="135" height="95" rx="26" ry="26" fill="url(#blueGradient)"/>
    
    <!-- Bubble Top Light Reflective Curve -->
    <path d="M 46,30 L 129,30 A 26,26 0 0,1 155,56 L 155,65 A 26,26 0 0,1 46,30 Z" fill="url(#bubbleHighlight)"/>

    <!-- Sad Face Details -->
    <!-- Left Eye -->
    <circle cx="65" cy="67" r="5" fill="#2C3E50"/>
    <!-- Right Eye -->
    <circle cx="110" cy="67" r="5" fill="#2C3E50"/>
    <!-- Sad Mouth Arc -->
    <path d="M 62,100 Q 87.5,73 113,100" fill="none" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
